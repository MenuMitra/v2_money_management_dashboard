[build]
  command = "npm run build"
  publish = "dist"

# Production context - used for production branch deploys
[context.production.environment]
  VITE_PROD_API_URL = "https://ghanish.in"
  VITE_ENVIRONMENT = "production"
  # Ensure testing URL is not set in production to prevent fallback
  VITE_TESTING_API_URL = ""
  VITE_DEV_API_URL = ""

# Default context - used for branch previews and other deploys
[context.default.environment]
  VITE_TESTING_API_URL = "https://menu4.xyz"
  VITE_ENVIRONMENT = "testing"
  VITE_DEV_API_URL = "https://menu4.xyz"

# Deploy preview context - used for pull request previews
[context.deploy-preview.environment]
  VITE_TESTING_API_URL = "https://menu4.xyz"
  VITE_ENVIRONMENT = "testing"
  VITE_DEV_API_URL = "https://menu4.xyz"

# Branch-specific context for testing branch (if you have a testing branch)
[context.testing.environment]
  VITE_TESTING_API_URL = "https://menu4.xyz"
  VITE_ENVIRONMENT = "testing"
  VITE_DEV_API_URL = "https://menu4.xyz"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 